disabled_rules:
  - trailing_comma

opt_in_rules:
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where

excluded:
  - .build
  - DerivedData
  - Pods
  - SuwayomiAPI

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true
