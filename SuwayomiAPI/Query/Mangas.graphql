query MangaList(
  $inLibrary: Boolean = true
  $first: Int = 20
  $orderBy: MangaOrderBy = TITLE
  $orderType: SortOrder = ASC
  $after: Cursor
) {
  mangas(
    first: $first
    after: $after
    condition: {inLibrary: $inLibrary}
    order: [{by: $orderBy, byType: $orderType}]
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasNextPage
    }
    nodes {
      id
      title
      thumbnailUrl
    }
  }
}

query MangaDetails($id: Int) {
  mangas(condition: {id: $id}) {
    nodes {
      artist
      author
      description
      genre
      status
      realUrl
      inLibrary
    }
  }
}

query MangaChapters(
  $id: Int = 98
  $first: Int = 10
  $orderBy: ChapterOrderBy = CHAPTER_NUMBER
  $orderType: SortOrder = DESC
  $after: Cursor
) {
  chapters(
    condition: {mangaId: $id}
    order: [{by: $orderBy, byType: $orderType}]
    first: $first
    after: $after
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasNextPage
    }
    nodes {
      id
      chapterNumber
      name
      realUrl
      scanlator
    }
  }
}
