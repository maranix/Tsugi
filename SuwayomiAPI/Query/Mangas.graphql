query MangaList($inLibrary: Boolean) {
  mangas(condition: {inLibrary: $inLibrary}) {
    nodes {
      id,
      title,
      thumbnailUrl
    }
  }
}

query MangaDetails($id: Int) {
  mangas(condition: {id: $id}) {
    nodes {
      artist
      author
      description
      genre
      status
      realUrl
      inLibrary
    }
  }
}

query MangaChapters(
  $id: Int,
  $first: Int,
  $after: Cursor,
  $orderBy: SortOrder
) {
  chapters(
    condition: {mangaId: $id}
    first: $first
    after: $after
    order: {by: CHAPTER_NUMBER, byType: $orderBy}
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasNextPage
    }
    nodes {
      id
      chapterNumber
      name
      realUrl
      scanlator
    }
  }
}
