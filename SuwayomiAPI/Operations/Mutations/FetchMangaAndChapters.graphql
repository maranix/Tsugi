mutation FetchMangaAndChapters($id: Int!) {
  fetchMangaAndChapters(
    input: {id: $id, fetchManga: true, fetchChapters: true}
  ) {
    manga {
      artist
      author
      description
      genre
      status
      inLibrary
      realUrl
      hasDuplicateChapters
      unreadCount
    }
    chapters {
      name
      id
      chapterNumber
      scanlator
      realUrl
      isRead
      isDownloaded
      isBookmarked
    }
  }
}
