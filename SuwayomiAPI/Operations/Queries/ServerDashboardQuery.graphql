fragment ServerInfoFields on AboutServerPayload {
  name
  version
  buildType
  buildTime
  github
  discord
  platformInfo {
    arch
    headless
    os {
      name
      version
    }
    jvm {
      javaVersion
      vmName
    }
  }
}

fragment ServerConfigFields on SettingsType {
  # Library & Updates
  globalUpdateInterval
  autoDownloadNewChapters
  autoDownloadNewChaptersLimit
  autoDownloadIgnoreReUploads
  maxSourcesInParallel
  excludeCompleted
  excludeNotStarted

  # Downloads & Storage
  downloadAsCbz
  downloadsPath
  localSourcePath
  backupPath

  # Flaresolverr
  flareSolverrEnabled
  flareSolverrUrl
  flareSolverrTimeout

  # Backups
  backupInterval
  backupTTL
  autoBackupIncludeCategories
  autoBackupIncludeManga
  autoBackupIncludeTracking
}

query ServerDashboard {
  aboutServer {
    ...ServerInfoFields
  }
  settings {
    ...ServerConfigFields
  }
}
