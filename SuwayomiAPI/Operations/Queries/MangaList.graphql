query MangaList(
  $inLibrary: Boolean!
  $first: Int!
  $orderBy: MangaOrderBy!
  $orderType: SortOrder!
  $after: Cursor
) {
  mangas(
    first: $first
    after: $after
    condition: {inLibrary: $inLibrary}
    order: [{by: $orderBy, byType: $orderType}]
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasNextPage
    }
    nodes {
      id
      title
      thumbnailUrl
    }
  }
}
