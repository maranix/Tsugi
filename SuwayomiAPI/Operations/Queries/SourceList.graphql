query SourceList(
  $first: Int! = 20
  $orderBy: SourceOrderBy! = ID
  $orderType: SortOrder! = ASC
  $after: Cursor
) {
  sources(
    first: $first
    after: $after
    order: {by: $orderBy, byType: $orderType}
  ) {
    totalCount
    pageInfo {
      hasNextPage
      startCursor
      endCursor
    }
    nodes {
      id
      name
      displayName
      iconUrl
      homeUrl
      lang
      supportsLatest
      contentWarning
      isConfigurable
    }
  }
}
